# Native GR00T N1.7 baseline; start fresh, sequence sampling retained.
# Required PYTHONPATH: this RLinf checkout, then ../Isaac-GR00T.
# Do not resume checkpoints from the legacy TTT/ExplicitDiT implementation.
defaults:
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-3
  tracer:
    enable: false

runner:
  task_type: sft
  logger:
    project_name: robottt
    experiment_name: sequence128
    log_path: /mnt/public/chenzm/robottt/h800_sft/sequence128
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 10000
  val_check_interval: -1
  save_interval: 2000
  resume_dir: /mnt/public/chenzm/robottt/h800_sft/sequence128/sequence128/checkpoints/global_step_6000
  per_worker_log: false
  per_worker_log_path: null

data:
  train_data_paths: /mnt/public/chenzm/robottt/h800_sft/assets/lerobot
  val_data_paths: null
  expected_episodes: 104
  num_workers: 2
  prefetch_factor: 1
  video_backend: torchcodec
  robottt:
    action_horizon: 40
    stride: 8
    max_anchors: 128
    terminal_window_probability: 0.0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42
  cpu_threads: 4
  enable_offload: false
  model:
    model_type: gr00t_n1d7
    sequence_training: true
    precision: fp32
    load_to_device: false
    is_lora: false
    add_value_head: false
    model_path: /mnt/public/chenzm/robottt/h800_sft/assets/GR00T-N1.7-3B
    backbone_model_path: /mnt/public/chenzm/robottt/h800_sft/assets/Cosmos-Reason2-2B
    dependency_path: /mnt/public/chenzm/robottt/h800_sft/code/Isaac-GR00T
    dependency_commit: 23ace64f17aa5015259b8609d371eb61a357c776
    embodiment_tag: new_embodiment
    obs_converter_type: robocasa365
    action_dim: 12
    valid_action_dim: 12
    image_nums: 3
    num_action_chunks: 8
    denoising_steps: 4
    binary_action_threshold: 0.0
    tbptt_segment_length: 16
    gradient_checkpointing: true
    rl_head_config:
      use_ttt: false
      # Disable nn.Dropout only, as in the legacy sequence protocol.
      # Native functional state dropout stays at the base model value (0.2).
      disable_dropout: true
      add_value_head: false
      ttt:
        num_register_tokens: 0
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-5
    clip_grad: 1.0
    # Sequence worker compatibility: first update uses lr / 200, not zero.
    lr_scheduler: linear_warmup_cosine
    lr_warmup_steps: 200
    total_training_steps: 10000
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: true
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
    save_full_model_weights: true
