defaults:
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa_bowlandcup_sft_gr00t_n1d7_robottt_fixed_20k"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 1000
  log_interval: 50
  resume_dir: null

data:
  # Output of:
  #   python toolkits/lerobot/convert_realworld_pni_to_gr00t.py convert \
  #       --src /path/to/realworld-pni --dst /path/to/realworld-pni-gr00t
  train_data_paths: /mnt/public/chenzm/robottt/datasets/robocasa365/BowlAndCup/lerobot/lerobot
  num_workers: 4
  prefetch_factor: 2
  video_backend: torchcodec
  robottt:
    # Rollout emits 8 environment actions per policy call. Sample training
    # observations at the same cadence so one TTT update has the same temporal
    # meaning in SFT and deployment. T=64, stride=8 retains all 104 episodes.
    num_timesteps: 64
    timestep_stride: 8
    human_video_path: null
    human_video_timesteps: 0
    modality_config_path: examples/sft/config/robocasa365_panda_omron_config.py
    modality_config_name: robocasa365_panda_omron_config

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Paper post-train: per-device 1, 8 GPU → global 8.
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42

  model:
    model_type: "gr00t_n1d7"
    precision: bf16
    # Official GR00T-N1.7 after patch-processor (new_embodiment / id 10).
    # There is no RoboTTT-8K checkpoint to start from; TTT layers init here.
    model_path: /mnt/public/guozhen/dev_robottt/GR00T-N1.7-realworld-pni
    backbone_model_path: /mnt/public/guozhen/models/Cosmos-Reason2-2B
    embodiment_tag: new_embodiment
    action_dim: 12
    valid_action_dim: 12
    image_nums: 3
    add_value_head: False
    num_action_chunks: 8
    denoising_steps: 4
    tbptt_segment_length: 16
    rl_head_config:
      use_ttt: True
      add_value_head: False
      disable_dropout: True
      ttt:
        fast_model: mlp
        num_register_tokens: 16
        # Exclude teacher-forced action tokens from recurrent memory. They are
        # noised expert actions during SFT but policy-generated during rollout.
        context_tokens: register_state
        # Training starts each 64-call window from W_0, so deployment does too.
        max_rollout_context_steps: 64
        # Paper post-train: full-parameter finetune (not TTT-only pretrain).
        train_ttt_only: False
        gate_init: 0.001
        base_lr: 0.1

  # Paper post-train: AdamW, wd 1e-5, cosine peak 5e-5, 20K steps.
  optim:
    lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-5
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 200
    total_training_steps: 20000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
