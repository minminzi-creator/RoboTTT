defaults:
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file:///mnt/public/chenzm/robottt/workspace/RLinf-robottt-fix-20260920/examples/sft/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robocasa_bowlandcup_sft_gr00t_n1d7_baseline_20k"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 1000
  log_interval: 50
  resume_dir: null

data:
  train_data_paths: /mnt/public/chenzm/robottt/datasets/robocasa365/BowlAndCup/lerobot/lerobot
  num_workers: 4
  prefetch_factor: 2
  video_backend: torchcodec
  robottt:
    # Match the deployed RoboTTT cadence: 64 policy calls, each separated by
    # the 8 environment actions emitted by one policy inference.
    num_timesteps: 64
    timestep_stride: 8
    human_video_path: null
    human_video_timesteps: 0
    modality_config_path: /mnt/public/chenzm/robottt/workspace/RLinf-robottt-fix-20260920/examples/sft/config/robocasa365_panda_omron_config.py
    modality_config_name: robocasa365_panda_omron_config

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Four GPUs: global batch 8 is preserved with accumulation=2.
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42

  model:
    model_type: "gr00t_n1d7"
    precision: bf16
    model_path: /mnt/public/guozhen/dev_robottt/GR00T-N1.7-realworld-pni
    backbone_model_path: /mnt/public/guozhen/models/Cosmos-Reason2-2B
    embodiment_tag: new_embodiment
    action_dim: 12
    valid_action_dim: 12
    image_nums: 3
    add_value_head: False
    num_action_chunks: 8
    denoising_steps: 4
    tbptt_segment_length: 16
    rl_head_config:
      use_ttt: False
      add_value_head: False
      disable_dropout: True
      ttt:
        fast_model: mlp
        num_register_tokens: 16
        context_tokens: register_state
        max_rollout_context_steps: 64
        train_ttt_only: False
        gate_init: 0.001
        base_lr: 0.1

  optim:
    lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-5
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 200
    total_training_steps: 20000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    # Required on 4x A800: the aligned no-checkpointing configuration OOMs
    # during the first Qwen3-VL forward pass with micro_batch_size already 1.
    gradient_checkpointing: True
    # Serialize the 6.9 GB full state dict locally, then atomically copy it to
    # the nearly-full Lustre filesystem with retries. This prevents a transient
    # shared-storage error from publishing a truncated full_weights.pt.
    checkpoint_local_staging_dir: /tmp/rlinf-checkpoint-staging
    checkpoint_io_retries: 3
    checkpoint_io_retry_delay_s: 10
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
