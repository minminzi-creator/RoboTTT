# Shared A800 experiment settings for BowlAndCup RoboTTT training.
defaults:
  - /robottt/bowlandcup_model@actor.model
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    project_name: robottt
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 8000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null

data:
  train_data_paths: /mnt/public/chenzm/robottt/datasets/robocasa365/BowlAndCup/lerobot/lerobot
  val_data_paths: null
  expected_episodes: 104
  num_workers: 2
  prefetch_factor: 1
  video_backend: torchcodec
  robottt:
    # Train the full GR00T horizon; rollout still executes 8 actions.
    action_horizon: 40
    stride: 8
    max_anchors: 128

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42
  cpu_threads: 4
  # Compiler artifacts are disposable and highly write-intensive. Keep them
  # off the nearly-full shared filesystem and the small root filesystem.
  compiler_cache_dir: /dev/shm/robottt_compiler_cache/aligned_native
  enable_offload: false
  optim:
    lr: 5.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-05
    clip_grad: 1.0
    lr_scheduler: linear_warmup_cosine
    lr_warmup_steps: 200
    total_training_steps: 8000
    fail_on_nonfinite: true
  fsdp_config:
    gradient_checkpointing: false
    limit_all_gathers: true
    use_orig_params: true
    amp_autocast:
      enabled: true
      precision: bf16
    gradient_checkpointing_use_reentrant: false
    cast_forward_inputs: false
    cast_root_forward_inputs: false
    save_full_model_weights: true
    # Stage the large FP32 full-weight file in RAM, then publish atomically.
    checkpoint_local_staging_dir: /dev/shm/robottt_checkpoint_staging
    checkpoint_io_retries: 3
    checkpoint_io_retry_delay_s: 10
