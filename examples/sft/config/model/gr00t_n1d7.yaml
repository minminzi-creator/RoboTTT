# Shared GR00T sequence-SFT model. Dataset dimensions and local paths belong
# to the experiment group; baseline and RoboTTT use the same full backbone/DiT.
model_type: gr00t_n1d7
sequence_training: true
precision: fp32
is_lora: false
add_value_head: false
num_action_chunks: 8
denoising_steps: 4
tbptt_segment_length: 16
gradient_checkpointing: true
memory_write_source: final_prediction
memory_write_denoise_index: -1
binary_action_threshold: 0.0
rl_head_config:
  use_ttt: false
  disable_dropout: true
  add_value_head: false
  ttt:
    hidden_size: 1536
    num_heads: 32
    mlp_ratio: 4
    tokens_per_anchor: 57
    base_lr: 0.1
    gate_init: 0.001
    o_proj_std: 0.02
    rope_theta: 10000.0
    position_mode: flattened
    compile_inner: true
    num_register_tokens: 0
